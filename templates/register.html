<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Paws Without Homes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream:#fdf6ec;
      --warm:#f5ebe0;
      --rust:#c4652a;
      --rust-dark:#9e4d1e;
      --forest:#2d5016;
      --gold:#d4a853;
      --ink:#1a1208;
      --ash:#6b5b4e;
      --white:#fff;
      --shadow:rgba(26,18,8,.12);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,var(--cream),var(--warm));color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;overflow-x:hidden}
    .shell{width:100%;max-width:980px;display:grid;grid-template-columns:.95fr 1.05fr;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border-radius:28px;overflow:hidden;box-shadow:0 18px 60px var(--shadow)}
    .aside{background:linear-gradient(145deg,var(--rust),#e8845a);color:var(--white);padding:3rem}
    .aside p{margin-top:1rem;line-height:1.7;color:rgba(255,255,255,.88)}
    .card{padding:3rem;background:var(--white)}
    h2{font-family:'Playfair Display',serif;font-size:2rem}
    .sub{margin-top:.5rem;color:var(--ash);line-height:1.6}
    .alert{display:none;margin:1rem 0;padding:.9rem 1rem;border-radius:12px;font-size:.92rem}
    .alert.show{display:block}
    .alert-error{background:#fdecea;color:#b3261e;border:1px solid #ef9a9a}
    .field{margin-top:1rem}
    label{display:block;font-size:.88rem;font-weight:700;margin-bottom:.45rem}
    input{width:100%;padding:.9rem 1rem;border:1.5px solid rgba(107,91,78,.2);border-radius:12px;background:var(--cream);font:inherit;outline:none}
    input:focus{border-color:var(--rust);background:var(--white)}
    button{width:100%;margin-top:1.2rem;border:none;border-radius:14px;padding:1rem;background:var(--rust);color:var(--white);font:inherit;font-weight:700;cursor:pointer;min-height:44px}
    button:hover{background:var(--rust-dark)}
    .meta{margin-top:1rem;color:var(--ash);font-size:.92rem}
    .meta a{color:var(--forest);font-weight:700;text-decoration:none}
    .home-link{display:inline-block;margin-top:1.25rem;color:var(--forest);font-weight:700;text-decoration:none}
    @media(max-width:800px){.shell{grid-template-columns:1fr}.aside{display:none}.card{padding:2rem}}
    @media(max-width:600px){.sub{font-size:.9rem}.field{margin-top:1.25rem}.meta{font-size:.9rem}.home-link{margin-top:1.5rem}}
    @media(max-width:480px){body{padding:.75rem}.card{padding:1.25rem}h2{font-size:1.6rem}label{font-size:.85rem}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="aside">
      <p>Create an account to track your reported cases, receive real-time rescue updates, and stay connected with our volunteer network.</p>
    </aside>
    <section class="card">
      <h2>Sign Up</h2>
      <p class="sub">Start tracking your rescue reports in one secure place.</p>
      <div class="alert alert-error" id="register-alert"></div>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your full name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password">
      </div>
      <button id="register-btn" onclick="register()">Create Account</button>
      <p class="meta">Already have an account? <a href="/login?next={{ next_url|urlencode }}">Sign in</a></p>
      <a class="home-link" href="/">Back to home</a>
    </section>
  </div>
  <script>
    const nextUrl = {{ next_url|tojson }};
    async function register() {
      const button = document.getElementById("register-btn");
      const alert = document.getElementById("register-alert");
      alert.className = "alert alert-error";
      alert.textContent = "";
      button.disabled = true;
      button.textContent = "Creating account...";
      const response = await fetch("/api/register", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        })
      });
      const data = await response.json();
      button.disabled = false;
      button.textContent = "Create Account";
      if (!data.success) {
        alert.textContent = data.message || "Unable to create your account.";
        alert.classList.add("show");
        return;
      }
      window.location.href = nextUrl || "/";
    }
  </script>
</body>
</html>
